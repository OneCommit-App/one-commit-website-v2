name: Website Release Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL to smoke test
        required: true
        default: https://www.onecommit.us
      apex_url:
        description: Apex URL expected to redirect to the base URL
        required: true
        default: https://onecommit.us

permissions:
  contents: read

concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node --test scripts/security-headers.test.mjs
      - run: node --test scripts/b2b-claims.test.mjs
      - run: pnpm audit --prod
      - run: pnpm build
      - run: node scripts/canonical-host.test.mjs
      - run: node scripts/public-shell.test.mjs
      - run: node scripts/home-ssr.test.mjs
      - run: node scripts/download-states.test.mjs

  production-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBSITE_SMOKE_BASE_URL: ${{ inputs.base_url }}
      WEBSITE_SMOKE_APEX_URL: ${{ inputs.apex_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: node scripts/smoke-production.mjs
